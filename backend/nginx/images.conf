server {
    # This snippet should be included in your main nginx server block
    
    # Serve images directly from VPS local storage
    location /images/ {
        # The alias directive maps the URL path to the filesystem path
        alias /var/storage/;
        
        # Add caching headers for performance
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Allow CORS if needed (e.g., if images are requested from different subdomains)
        add_header Access-Control-Allow-Origin "*";
        
        # Fallback if image is not found
        try_files $uri $uri/ =404;
    }
}
